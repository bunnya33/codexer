<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codexer 服务器升级登录</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f6f8;color:#20242d;font:15px system-ui,sans-serif}.card{width:100%;max-width:460px;padding:30px;border:1px solid #e3e6eb;border-radius:20px;background:white;box-shadow:0 14px 48px #20304a0d}h1{font-size:23px;margin:0 0 12px}p{color:#667085;line-height:1.7}label{display:block;margin:18px 0 7px;font-weight:600;font-size:13px}input:not([type=checkbox]){width:100%;padding:12px;border:1px solid #d4d9e2;border-radius:9px;font:inherit}.check{display:flex;gap:9px;align-items:center;font-weight:400}button{width:100%;margin-top:24px;padding:12px;border:0;border-radius:10px;background:#1e2533;color:white;font:600 15px system-ui;cursor:pointer}button:disabled{opacity:.5}#result{white-space:pre-wrap;overflow-wrap:anywhere} .error{color:#b42318}.success{color:#16834d}.note{font-size:12px;margin-bottom:0}</style></head>
<body><main class="card"><h1>登录服务器升级工具</h1><p>使用 Codexer 管理员账号登录。登录后，Codex 可以在你要求升级时上传并安装服务器更新包。</p>
<form id="login"><label for="url">服务器地址</label><input id="url" type="url" placeholder="https://codexer.example.com" value="__SERVER_URL__" required autocomplete="url">
<label for="username">管理员账号</label><input id="username" required maxlength="100" autocomplete="username">
<label for="password">密码</label><input id="password" type="password" required maxlength="128" autocomplete="current-password">
<label class="check"><input id="http" type="checkbox" __ALLOW_HTTP__>此服务器使用 HTTP 连接</label>
<button id="submit">登录并保存会话</button></form><p id="result" role="status" aria-live="polite"></p><p class="note">只保存登录会话，不保存密码。Windows 使用当前用户的 DPAPI 加密；会话有效期遵循服务器设置。本页面十分钟后关闭。</p></main>
<script>
const form=document.querySelector('#login'),result=document.querySelector('#result'),button=document.querySelector('#submit');
const messages={'invalid-credentials':'账号或密码不正确。','login-expired':'账号或密码不正确。','admin-required':'请使用管理员账号。','server-unreachable':'无法连接服务器，请检查地址。','http-server-requires-allow-http':'此地址使用 HTTP，请确认上面的 HTTP 选项。','invalid-server-url':'请输入服务器根地址，不要包含 /admin 等路径。','login-or-save-failed':'登录或加密保存失败，请重试。'};
form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;result.className='';result.textContent='正在登录…';try{const response=await fetch(new URL('login',location.href),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url:document.querySelector('#url').value.trim(),username:document.querySelector('#username').value.trim(),password:document.querySelector('#password').value,allowHttp:document.querySelector('#http').checked})});const value=await response.json();if(!response.ok)throw Error(messages[value.error]||value.error||'登录失败');document.querySelector('#password').value='';form.hidden=true;result.className='success';result.textContent='登录已保存：'+value.url+'\n以后可以直接对 Codex 说“把 Codexer 更新到服务器”。本次登录不会安装更新。';}catch(error){result.className='error';result.textContent=error.message;}finally{button.disabled=false;}});
</script></body></html>
