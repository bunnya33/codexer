name: Publish server release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codexer_test
          POSTGRES_PASSWORD: codexer_test
          POSTGRES_DB: codexer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codexer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CODEXER_TEST_POSTGRES_URL: postgresql://codexer_test:codexer_test@127.0.0.1:5432/codexer_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Validate stable release version
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("package.json")).version; if (!/^\d+\.\d+\.\d+$/.test(v) || process.env.GITHUB_REF_NAME !== "v"+v) process.exit(1)'
      - run: npm ci
      - run: bash -n install.sh bootstrap.sh
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:docs
      - run: go test -race ./...
      - run: npm run build:server
      - run: CODEXER_TEST_BINARY="$PWD/dist/codexer" go test ./cmd/codexer -run StandaloneBinary
      - run: npm run package:server
        env:
          CODEXER_TARGETS: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64
      - name: Publish unified server bundle and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/codexer-server-*.tar.gz release/codexer-server-*.tar.gz.sha256 --verify-tag --generate-notes --title "Codexer $GITHUB_REF_NAME"
