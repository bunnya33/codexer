name: Local architecture build checks
on:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run mobile:typecheck
      - run: npm test
      - run: npm run check:docs
      - run: npm run package:desktop:win
        if: runner.os == 'Windows'
      - run: npm run package:desktop:mac
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-unsigned
          path: apps/desktop/release/*.*
  server:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash -n install.sh bootstrap.sh
      - run: npm run build:server
      - run: npm run package:server
      - uses: actions/upload-artifact@v4
        with:
          name: unified-server
          path: release/codexer-server-*
