name: Local architecture build checks
on:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'Windows'
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          archives: qtbase
          cache: true
      - run: npm ci
      - run: npm ci --prefix apps/control-native
        if: runner.os == 'Windows'
      - run: npm ci --prefix apps/control-native/macos
        if: runner.os == 'macOS'
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'macOS'
        with:
          ruby-version: '3.3'
          working-directory: apps/control-native/macos
          bundler-cache: true
      - run: npm run typecheck
      - run: npm run mobile:typecheck
      - run: npm test
      - run: npm run check:docs
      - name: Package Qt Windows Agent
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CODEXER_QT_ROOT = $env:QT_ROOT_DIR
          npm run package:desktop:win
      - run: npm run package:desktop:mac:local -- --arm64
        if: runner.os == 'macOS'
      - run: npm run package:windows-native
        if: runner.os == 'Windows'
      - run: npm run package:macos-native
        if: runner.os == 'macOS'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-unsigned
          path: |
            apps/control-native/release/*.*
            apps/desktop/release/*.*
            apps/agent-qt/release/*.*
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: codexer_test
          POSTGRES_PASSWORD: codexer_test
          POSTGRES_DB: codexer_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codexer_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CODEXER_TEST_POSTGRES_URL: postgresql://codexer_test:codexer_test@127.0.0.1:5432/codexer_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: bash -n install.sh bootstrap.sh
      - run: go test -race ./...
      - run: npm run build:server
      - run: CODEXER_TEST_BINARY="$PWD/dist/codexer" go test ./cmd/codexer -run StandaloneBinary
      - run: npm run package:server
      - uses: actions/upload-artifact@v4
        with:
          name: unified-server
          path: release/codexer-server-*
