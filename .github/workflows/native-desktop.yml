name: Shared native desktop clients
on:
  workflow_dispatch:
  push:
    branches: ['codex/native-desktop', 'main']
    paths:
      - 'apps/control-native/**'
      - 'apps/mobile/**'
      - 'apps/pc-agent/**'
      - 'packages/**'
      - 'scripts/build-native-*.mjs'
      - 'scripts/sign-native-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-native-macos.mjs'
      - 'scripts/accept-native-*.mjs'
      - '.github/workflows/native-desktop.yml'
      - '!apps/control-native/**/*.md'
  pull_request:
    paths:
      - 'apps/control-native/**'
      - 'apps/mobile/**'
      - 'apps/pc-agent/**'
      - 'packages/**'
      - 'scripts/build-native-*.mjs'
      - 'scripts/sign-native-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-native-macos.mjs'
      - 'scripts/accept-native-*.mjs'
      - '.github/workflows/native-desktop.yml'
      - '!apps/control-native/**/*.md'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/control-native/package-lock.json
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - name: Select installed C++ toolset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          Start-Transcript -Path diagnostics/windows-toolset.log
          try {
            $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if (!$vs) { throw 'Visual C++ desktop tools are not installed' }
            Write-Output "Visual Studio: $vs"
            $toolsets = Get-ChildItem "$vs/MSBuild/Microsoft/VC" -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^v14[35]$' -and $_.FullName -match 'PlatformToolsets' }
            $toolsets | Select-Object FullName | Format-Table -AutoSize
            $toolset = $toolsets | Sort-Object Name -Descending | Select-Object -First 1
            if (!$toolset) { throw 'No supported Visual C++ desktop toolset found' }
            "CODEXER_PLATFORM_TOOLSET=$($toolset.Name)" >> $env:GITHUB_ENV
          } finally { Stop-Transcript }
      - run: npm ci
      - run: npm ci --prefix apps/control-native
      - run: node scripts/build-native-sidecar.mjs
      - run: node --test apps/control-native/test/sidecar.test.cjs
      - name: Package Windows native clients
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnostics | Out-Null
          npm run package:windows-native 2>&1 | Tee-Object -FilePath diagnostics/windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows native host startup
        shell: pwsh
        run: |
          npx tsx scripts/accept-native-windows.ts 2>&1 | Tee-Object -FilePath diagnostics/windows-startup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-Windows-diagnostics
          path: diagnostics/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-Windows-x64
          path: apps/control-native/release/*
          if-no-files-found: ignore
  macos:
    runs-on: macos-15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/control-native/macos/package-lock.json
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          working-directory: apps/control-native/macos
          bundler-cache: true
      - run: npm ci
      - run: npm ci --prefix apps/control-native/macos
      - run: npm run check:macos-native
      - name: Package macOS native clients
        shell: bash
        run: |
          mkdir -p diagnostics
          set -o pipefail
          npm run package:macos-native 2>&1 | tee diagnostics/macos-build.log
      - name: Verify macOS sidecar and native host startup
        shell: bash
        env:
          CODEXER_NATIVE_SERVICE: apps/control-native/macos/build/service/sidecar.cjs
        run: |
          set -o pipefail
          node --test apps/control-native/test/sidecar.test.cjs 2>&1 | tee diagnostics/macos-sidecar.log
          node scripts/accept-native-macos.mjs 2>&1 | tee diagnostics/macos-startup.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-macOS-diagnostics
          path: diagnostics/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-macOS
          path: apps/control-native/release/*
          if-no-files-found: ignore
