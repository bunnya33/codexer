<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>RelayDesk · 连接服务器</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="../titlebar/styles.css" />
    <script defer src="../titlebar/titlebar.js"></script>
    <script defer src="./setup.js"></script>
  </head>
  <body data-window-label="连接服务器">
    <header id="titlebar" class="window-titlebar"></header>
    <main>
      <div class="brand">
        <img src="../icon.png" alt="" width="36" height="36" /><span>RelayDesk</span>
      </div>
      <h1>连接服务器</h1>
      <p class="intro">登录后即可查看会话、发送消息和查看文件。</p>
      <form id="connection">
        <label for="server">服务器地址</label>
        <input
          id="server"
          type="url"
          placeholder="例如 http://192.0.2.10:8899"
          autocomplete="url"
          spellcheck="false"
          required
          autofocus
        />
        <p class="hint">填写服务器的完整根地址，支持 HTTP 和 HTTPS。</p>
        <p id="message" role="status" aria-live="polite"></p>
        <button id="connect" type="submit" disabled>连接服务器</button>
      </form>
      <footer id="version">Windows 控制端</footer>
    </main>
  </body>
</html>
