services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: codex_remote
      POSTGRES_USER: codex_remote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codex_remote -d codex_remote"]
      interval: 10s
      timeout: 5s
      retries: 10
  relay:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://codex_remote:${POSTGRES_PASSWORD}@postgres:5432/codex_remote
      RELAY_ADMIN_USERNAME: ${RELAY_ADMIN_USERNAME:-admin}
      RELAY_ADMIN_PASSWORD: ${RELAY_ADMIN_PASSWORD:?Set a password of at least 12 characters}
      RELAY_ALLOWED_ORIGINS: https://${REMOTE_DOMAIN:?Set REMOTE_DOMAIN}
      RELAY_DATA_DIR: /var/lib/codexer
      RELAY_WEIXIN_ENABLED: ${RELAY_WEIXIN_ENABLED:-true}
      RELAY_WEIXIN_KEY: ${RELAY_WEIXIN_KEY:-}
    volumes:
      - relay-data:/var/lib/codexer
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      REMOTE_DOMAIN: ${REMOTE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      relay:
        condition: service_healthy
volumes:
  postgres-data:
  relay-data:
  caddy-data:
  caddy-config:
