services:
  relay:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      RELAY_ADMIN_USERNAME: ${RELAY_ADMIN_USERNAME:-admin}
      RELAY_ADMIN_PASSWORD: ${RELAY_ADMIN_PASSWORD:?Set a password of at least 12 characters}
      RELAY_ALLOWED_ORIGINS: https://${REMOTE_DOMAIN:?Set REMOTE_DOMAIN}
      RELAY_DATA_DIR: /var/lib/codexer
      RELAY_WEIXIN_ENABLED: ${RELAY_WEIXIN_ENABLED:-true}
      RELAY_WEIXIN_KEY: ${RELAY_WEIXIN_KEY:-}
    volumes:
      - relay-data:/var/lib/codexer
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "/app/codexer", "health", "http://127.0.0.1:8787"]
      interval: 15s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      REMOTE_DOMAIN: ${REMOTE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      relay:
        condition: service_healthy
volumes:
  relay-data:
  caddy-data:
  caddy-config:
